#---------------------------
# Fluid 主题配置（覆盖主题默认值）
# 配置指南: https://hexo.fluid-dev.com/docs/guide/
#---------------------------

# 导航栏
navbar:
  # 导航栏标题
  blog_title: "ly-9603 的博客"
  # 导航栏菜单项
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 首页
index:
  # 首页 banner 配置
  banner:
    # 是否显示首页 banner
    enable: true
    # 鼠标向下滑动时是否显示波浪动画
    wave: true
    # 首屏加载动画
    cloud:
      enable: true
  # 首页副标题
  slogan:
    enable: true
    # 为空则按 hexo config.subtitle 显示
    text: "记录生活 · 分享技术"
    # 打字机特效
    typed:
      enable: true
      # 输入的文字
      strings: ["欢迎来到我的博客", "记录生活 · 分享技术", "一个 Hexo + Fluid 的博客"]

# 文章
post:
  # 文章列表显示摘要
  excerpt:
    enable: true
    # 摘要截断位置 (超过后显示“阅读全文”按钮)
    length: 120
  # 文章页 meta 信息
  meta:
    author: false
    date: true
    wordcount: true
    min2read: true
    views: false

# 页脚
footer:
  # 页脚信息
  content: "Powered by <a href=\"https://hexo.io\" rel=\"nofollow\">Hexo</a> & <a href=\"https://github.com/fluid-dev/hexo-theme-fluid\" rel=\"nofollow\">Fluid</a>"
  # 备案号
  beian:
    enable: false

# 文章页 footer
post_footer:
  # 上一篇/下一篇
  prev_next: true
  # 文章版权信息
  copyright:
    enable: true

# 侧边栏
sidebar:
  # 侧边栏位置
  position: "left"
